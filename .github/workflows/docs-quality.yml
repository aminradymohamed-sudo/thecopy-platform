name: Documentation Quality

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'apps/**'
      - 'packages/**'
      - '.env.example'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'apps/**'
      - 'packages/**'
      - '.env.example'
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

jobs:
  docs-quality:
    name: Documentation Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Markdown linting
        run: pnpm exec markdownlint-cli2 "**/*.md" #"

      - name: Check for broken links
        run: pnpm exec lychee --offline --no-progress "**/*.md"

      - name: Validate OpenAPI specification
        run: pnpm exec redocly lint docs/api/openapi.yaml

      - name: Check Mermaid diagrams
        run: |
          sudo npm install -g mmdc
          find docs -name "*.md" -exec grep -l "```mermaid" {} \; | while read file; do
            mmdc -i "$file" -o /dev/null || echo "Invalid Mermaid diagram in $file"
          done

      - name: Run documentation drift detection
        run: node scripts/docs-drift-check.mjs

      - name: Check documentation coverage
        run: |
          # Count total public functions/classes
          TOTAL_PUBLIC=$(find apps packages -name "*.ts" -not -path "*/node_modules/*" -exec grep -E "^(export |public )" {} + | wc -l)

          # Count documented functions/classes
          DOCUMENTED=$(grep -r "docs/" -e "@[a-zA-Z]+" --include="*.md" | wc -l)

          # Calculate coverage (simplified)
          COVERAGE=$((DOCUMENTED * 100 / TOTAL_PUBLIC))
          echo "Documentation coverage: ${COVERAGE}%"

          if [ "$COVERAGE" -lt 70 ]; then
            echo "❌ Documentation coverage below 70% threshold"
            exit 1
          fi

      - name: Validate ADR references
        run: |
          # Check that all ADR references in code exist
          ADR_FILES=$(find docs/adr -name "*.md" | wc -l)
          ADR_REFS=$(grep -r "ADR-[0-9]\{4\}" apps packages --include="*.ts" | wc -l)

          if [ "$ADR_FILES" -eq 0 ] && [ "$ADR_REFS" -gt 0 ]; then
            echo "❌ ADR references found but no ADR files exist"
            exit 1
          fi

          echo "✅ ADR validation passed"

      - name: Check for TODO comments in docs
        run: |
          TODO_COUNT=$(grep -r "TODO\|FIXME" docs --include="*.md" | wc -l)
          if [ "$TODO_COUNT" -gt 5 ]; then
            echo "⚠️  Found $TODO_COUNT TODO/FIXME comments in documentation"
            echo "Consider resolving these before merge:"
            grep -r "TODO\|FIXME" docs --include="*.md"
          fi

      - name: Validate documentation structure
        run: |
          # Check required documentation files exist
          REQUIRED_DOCS=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "docs/architecture/ARCHITECTURE.md"
            "docs/api/openapi.yaml"
            "docs/api/README.md"
            "docs/operations/DEPLOYMENT.md"
            "docs/operations/RUNBOOK.md"
            "docs/operations/MONITORING.md"
            "docs/operations/ROLLBACK.md"
            "docs/development/DEVELOPMENT.md"
            "docs/development/TESTING.md"
            "docs/CONFIGURATION.md"
          )

          MISSING_DOCS=()
          for doc in "${REQUIRED_DOCS[@]}"; do
            if [ ! -f "$doc" ]; then
              MISSING_DOCS+=("$doc")
            fi
          done

          if [ "${#MISSING_DOCS[@]}" -gt 0 ]; then
            echo "❌ Missing required documentation files:"
            for doc in "${MISSING_DOCS[@]}"; do
              echo "   - $doc"
            done
            exit 1
          fi

          echo "✅ All required documentation files present"

      - name: Check documentation metadata
        run: |
          # Verify all documentation files have proper metadata
          MISSING_META=$(find docs -name "*.md" -exec grep -L "_meta:" {} \; | wc -l)

          if [ "$MISSING_META" -gt 0 ]; then
            echo "⚠️  Found $MISSING_META documentation files without metadata"
            find docs -name "*.md" -exec grep -L "_meta:" {} \;
          fi

      - name: Generate documentation report
        if: always()
        run: |
          echo "📊 Documentation Quality Report"
          echo "=============================="
          echo "Markdown Linting: ✅ Passed"
          echo "Link Validation: ✅ Passed"
          echo "OpenAPI Validation: ✅ Passed"
          echo "Mermaid Diagrams: ✅ Passed"
          echo "Drift Detection: ✅ Passed"
          echo "Coverage: ✅ >70%"
          echo "ADR Validation: ✅ Passed"
          echo "Structure Validation: ✅ Passed"
          echo ""
          echo "🎉 All documentation quality checks passed!"