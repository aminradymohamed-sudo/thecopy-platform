# =============================================================================
# Pipeline الأمن الكامل (10 طبقات: SAST / Secrets / Static / Deps / Trivy /
# SBOM / Licenses / DAST / Probes / Summary)
# مكمّل لـ security-audit.yml و security-trivy.yml و codeql.yml — لا يستبدلها.
# =============================================================================

name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      run_dast:
        description: تشغيل الفحوصات الديناميكية (ZAP و Nuclei)
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

concurrency:
  group: security-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '10.33.3'
  GITLEAKS_VERSION: '8.21.2'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Semgrep SAST
  # ---------------------------------------------------------------------------
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Semgrep with community rule packs + custom rules
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --config=p/nodejs \
            --config=p/secrets \
            --config=./configs/.semgrep.yml \
            --sarif --output=semgrep-results.sarif \
            --metrics=off \
            --quiet
        continue-on-error: true

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Semgrep raw artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2) Gitleaks Secrets (موسّع لمزودي AI + قواعد المستودع المخصصة)
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks scan (using merged root config)
        run: |
          gitleaks detect \
            --source=. \
            --config=./.gitleaks.toml \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif \
            --redact \
            --verbose \
            --no-banner \
            --exit-code=0

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Upload Gitleaks artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) ESLint Security
  # ---------------------------------------------------------------------------
  eslint-security:
    name: Static - ESLint Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          TIPTAP_PRO_TOKEN="$(echo "$SECRETS_JSON" | jq -r '.TIPTAP_PRO_TOKEN // empty')"
          if [ -n "$TIPTAP_PRO_TOKEN" ]; then
            echo "//registry.tiptap.dev/:_authToken=${TIPTAP_PRO_TOKEN}" > .npmrc
          fi
          pnpm install --frozen-lockfile

      - name: Run ESLint with security plugin
        run: |
          pnpm exec eslint . \
            --ext .js,.jsx,.ts,.tsx \
            --format=json \
            --output-file=eslint-security-results.json \
            --no-error-on-unmatched-pattern || true

      - name: Convert ESLint JSON to SARIF
        run: |
          pnpm dlx @microsoft/eslint-formatter-sarif \
            eslint-security-results.json \
            > eslint-security-results.sarif || echo "[]" > eslint-security-results.sarif

      - name: Upload ESLint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-security-results.sarif
          category: eslint-security
        continue-on-error: true

      - name: Upload ESLint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-security-results
          path: |
            eslint-security-results.json
            eslint-security-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4 + 5) pnpm audit + Trivy filesystem
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependencies - pnpm audit + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          TIPTAP_PRO_TOKEN="$(echo "$SECRETS_JSON" | jq -r '.TIPTAP_PRO_TOKEN // empty')"
          if [ -n "$TIPTAP_PRO_TOKEN" ]; then
            echo "//registry.tiptap.dev/:_authToken=${TIPTAP_PRO_TOKEN}" > .npmrc
          fi
          pnpm install --frozen-lockfile

      - name: Run pnpm audit (JSON output)
        run: |
          pnpm audit --json > pnpm-audit-results.json 2>&1 || true
          pnpm audit --audit-level=moderate || \
            echo "::warning::pnpm audit found vulnerabilities - see artifact"
        continue-on-error: true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Upload dependency artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: |
            pnpm-audit-results.json
            trivy-fs-results.sarif
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 6) SBOM CycloneDX
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          TIPTAP_PRO_TOKEN="$(echo "$SECRETS_JSON" | jq -r '.TIPTAP_PRO_TOKEN // empty')"
          if [ -n "$TIPTAP_PRO_TOKEN" ]; then
            echo "//registry.tiptap.dev/:_authToken=${TIPTAP_PRO_TOKEN}" > .npmrc
          fi
          pnpm install --frozen-lockfile

      - name: Generate SBOM (JSON)
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom.cyclonedx.json \
            --spec-version 1.5 \
            --omit dev

      - name: Generate SBOM (XML)
        run: |
          pnpm dlx @cyclonedx/cyclonedx-npm \
            --output-format XML \
            --output-file sbom.cyclonedx.xml \
            --spec-version 1.5 \
            --omit dev

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            sbom.cyclonedx.json
            sbom.cyclonedx.xml
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 7) License audit
  # ---------------------------------------------------------------------------
  license-audit:
    name: Licenses - license-checker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
        run: |
          TIPTAP_PRO_TOKEN="$(echo "$SECRETS_JSON" | jq -r '.TIPTAP_PRO_TOKEN // empty')"
          if [ -n "$TIPTAP_PRO_TOKEN" ]; then
            echo "//registry.tiptap.dev/:_authToken=${TIPTAP_PRO_TOKEN}" > .npmrc
          fi
          pnpm install --frozen-lockfile

      - name: Generate license report
        run: |
          pnpm dlx license-checker \
            --production \
            --json \
            --excludePrivatePackages \
            --out license-report.json
          pnpm dlx license-checker \
            --production \
            --summary \
            --excludePrivatePackages

      - name: Fail on copyleft licenses
        run: |
          pnpm dlx license-checker \
            --production \
            --excludePrivatePackages \
            --failOn 'GPL;AGPL;LGPL;CPAL;OSL;EPL;CDDL;SSPL'
        continue-on-error: true

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-audit-results
          path: license-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 8) OWASP ZAP Baseline (DAST) — أسبوعي أو يدوي
  # ---------------------------------------------------------------------------
  zap-baseline:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_dast == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.ZAP_TARGET_URL || 'https://staging.thecopy.app' }}
          rules_file_name: 'configs/.zap-rules.tsv'
          cmd_options: '-a -j -m 5 -T 60'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-results'

  # ---------------------------------------------------------------------------
  # 9) Nuclei HTTP Probes — أسبوعي أو يدوي
  # ---------------------------------------------------------------------------
  nuclei-scan:
    name: Probes - Nuclei
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_dast == 'true')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Nuclei scan
        uses: projectdiscovery/nuclei-action@v3
        with:
          target: ${{ vars.NUCLEI_TARGET_URL || 'https://staging.thecopy.app' }}
          templates: 'configs/nuclei-templates.txt'
          output: 'nuclei-results.txt'
          flags: '-severity critical,high,medium -rate-limit 50 -timeout 10 -silent'

      - name: Upload Nuclei results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-results
          path: nuclei-results.txt
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 10) Aggregated summary + PR comment
  # ---------------------------------------------------------------------------
  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - semgrep
      - gitleaks
      - eslint-security
      - dependency-audit
      - sbom
      - license-audit
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts

      - name: Generate summary report
        run: |
          chmod +x scripts/security/security-summary.sh
          mkdir -p reports
          ./scripts/security/security-summary.sh \
            security-artifacts \
            reports/SECURITY-SUMMARY.md

      - name: Post summary as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/SECURITY-SUMMARY.md';
            if (!fs.existsSync(path)) {
              core.warning('Summary file not found');
              return;
            }
            const summary = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload final summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: reports/SECURITY-SUMMARY.md
          retention-days: 90

      - name: Write summary to GitHub Step Summary
        if: always()
        run: |
          if [[ -f reports/SECURITY-SUMMARY.md ]]; then
            cat reports/SECURITY-SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
