# =============================================================================
# إعدادات pre-commit hooks
# فحوصات سريعة قبل كل commit لرفع جودة الكود ومنع تسريب الأسرار
# التثبيت: pip install pre-commit && pre-commit install
# =============================================================================

# الحد الأدنى لإصدار pre-commit
minimum_pre_commit_version: 3.5.0

# تشغيل كل الـ hooks بالتوازي حيث أمكن
default_install_hook_types:
  - pre-commit
  - commit-msg

# لا تشغل على ملفات معينة بشكل افتراضي
exclude: |
  (?x)^(
    .*\.lock$|
    .*\.min\.(js|css)$|
    node_modules/.*|
    dist/.*|
    build/.*|
    \.next/.*|
    coverage/.*|
    pnpm-lock\.yaml|
    package-lock\.json
  )$

repos:
  # ---------------------------------------------------------------------------
  # كشف الأسرار قبل الـ commit
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: detect-secrets
        description: فحص الأسرار المكشوفة قبل الـ commit
        args:
          - --verbose
          - --redact
          - --no-banner

  # ---------------------------------------------------------------------------
  # SAST سريع على الملفات المعدلة فقط
  # ---------------------------------------------------------------------------
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.95.0
    hooks:
      - id: semgrep
        name: semgrep-security-audit
        description: فحص SAST سريع للملفات المعدلة
        args:
          - --config=p/security-audit
          - --config=p/javascript
          - --config=p/typescript
          - --error
          - --skip-unknown-extensions
          - --quiet

  # ---------------------------------------------------------------------------
  # فحوصات عامة من pre-commit-hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
        name: detect-private-keys
        description: منع رفع المفاتيح الخاصة

      - id: check-added-large-files
        name: prevent-large-files
        description: منع الملفات الكبيرة
        args: [--maxkb=1024]

      - id: forbid-new-submodules
        name: forbid-new-submodules
        description: منع إضافة submodules جديدة

      - id: check-merge-conflict
        name: check-merge-conflicts
        description: التحقق من بقايا merge conflicts

      - id: check-case-conflict
        name: check-case-conflict
        description: التحقق من تعارض حالة الحروف في أسماء الملفات

      - id: check-symlinks
        name: check-symlinks
        description: التحقق من symlinks المعطلة

      - id: end-of-file-fixer
        name: fix-end-of-file
        description: ضمان سطر فارغ في نهاية الملف

      - id: trailing-whitespace
        name: trim-trailing-whitespace
        description: إزالة المسافات الزائدة في نهاية السطور
        args: [--markdown-linebreak-ext=md]

      - id: mixed-line-ending
        name: fix-line-endings
        description: توحيد نهايات السطور

  # ---------------------------------------------------------------------------
  # ESLint مع plugin الأمن (محلي)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint-security
        name: eslint-security-plugin
        description: فحص ESLint مع plugin الأمن
        entry: pnpm exec eslint
        language: system
        files: \.(js|jsx|ts|tsx)$
        args:
          - --max-warnings=0
          - --no-error-on-unmatched-pattern
        pass_filenames: true

      - id: prevent-env-commits
        name: prevent-env-commits
        description: منع رفع ملفات env بالخطأ
        entry: |
          bash -c '
          for f in "$@"; do
            if [[ "$f" =~ \.env$ ]] || [[ "$f" =~ \.env\.(local|production|development)$ ]]; then
              echo "ممنوع رفع: $f"
              exit 1
            fi
          done
          '
        language: system
        types: [file]

# ---------------------------------------------------------------------------
# إعدادات CI لـ pre-commit
# ---------------------------------------------------------------------------
ci:
  autofix_commit_msg: 'style: تطبيق إصلاحات pre-commit التلقائية'
  autofix_prs: true
  autoupdate_branch: 'develop'
  autoupdate_commit_msg: 'chore: تحديث pre-commit hooks'
  autoupdate_schedule: monthly
  skip: [semgrep, eslint-security]
